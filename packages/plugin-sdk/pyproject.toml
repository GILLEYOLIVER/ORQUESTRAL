[project]
name = "orkestral-plugin-sdk"
version = "0.2.0"
description = "Contrato de extensibilidade para plugins da plataforma Orkestral"
requires-python = ">=3.13,<3.14"
dependencies = ["cryptography==48.0.1"]

[project.scripts]
orkestral-plugin = "orkestral_plugin_sdk.cli:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orkestral_plugin_sdk"]
