name: orkestral

services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/01-create-n8n.sql:/docker-entrypoint-initdb.d/01-create-n8n.sql:ro
    networks: [backend, automation]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.0.6-alpine3.21
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-storage:
    image: rustfs/rustfs:1.0.0-beta.11-preview.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - object-storage-rustfs-data:/data
    networks: [storage]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.31.5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile","n8n-nodes-base.ssh"]'
      N8N_SECURE_COOKIE: "true"
      N8N_PORT: 5678
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [automation]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5678/healthz/readiness >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    image: orkestral-api:0.4.0
    build:
      context: .
      dockerfile: Dockerfile.api
      target: production
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_PROCESS_ROLE: api
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      N8N_BASE_URL: ${N8N_BASE_URL}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
    volumes:
      - ./infrastructure:/workspace/infrastructure:ro
    networks: [backend, automation, storage]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  worker:
    image: orkestral-worker:0.4.0
    build:
      context: .
      dockerfile: Dockerfile.api
      target: production
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_PROCESS_ROLE: worker
    command:
      [
        "celery",
        "-A",
        "worker.main:celery_app",
        "worker",
        "--beat",
        "--loglevel=INFO",
      ]
    networks: [backend, storage]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A worker.main:celery_app inspect ping --destination celery@$${HOSTNAME} --timeout 5 | grep -q pong",
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  web:
    image: orkestral-web:0.4.0
    build:
      context: .
      dockerfile: Dockerfile.web
      target: production
      args:
        VITE_API_BASE_URL: ""
        DEVELOPMENT_PREVIEW_ENABLED: "false"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.31.3-alpine3.24
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [edge, backend]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  edge:
  backend:
    internal: true
  automation:
    internal: true
  storage:
    internal: true

volumes:
  postgres-data:
  redis-data:
  object-storage-rustfs-data:
  n8n-data:
