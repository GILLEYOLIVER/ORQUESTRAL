[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/plugin-sdk"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/api", "apps/worker"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"apps/api/app/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["apps/api", "apps/worker"]
exclude = ["apps/api/app/migrations/versions"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "apps/worker/tests", "tests/integration", "tests/security"]
markers = [
  "integration: requires external infrastructure",
  "security: exercises security boundaries",
]
