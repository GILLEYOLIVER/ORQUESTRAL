map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=orkestral_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=orkestral_connections:10m;
server_tokens off;

server {
    listen 80 default_server;
    server_name "";
    return 403;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    client_max_body_size 20m;
    limit_req_status 429;
    limit_conn_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    if ($request_uri ~* "(\.\.|%2e%2e|%2e%2f|%2f%2e|%5c)") {
        return 400;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        include /etc/nginx/proxy_params;
    }

    location = /health/agent-memory-scheduler {
        proxy_pass http://api:8000/health/agent-memory-scheduler;
        include /etc/nginx/proxy_params;
    }

    location = /ready {
        proxy_pass http://api:8000/ready;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=orkestral_api burst=80 nodelay;
        limit_conn orkestral_connections 30;
        proxy_pass http://api:8000/;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://web:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
