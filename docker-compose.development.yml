services:
  postgres:
    networks:
      - postgres-development-access
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"

  redis:
    networks:
      - redis-development-access
    ports:
      - "127.0.0.1:6379:6379"

  object-storage:
    networks:
      - storage-development-access
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  n8n:
    environment:
      N8N_SECURE_COOKIE: "false"
    networks:
      - n8n-development-access
    ports:
      - "127.0.0.1:5678:5678"

  api:
    build:
      target: development
    command:
      [
        "sh",
        "-c",
        "cd /workspace/apps/api && alembic -c alembic.ini upgrade head && python -m app.scripts.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload",
      ]
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - api-development-access
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./apps/worker:/workspace/apps/worker
      - ./infrastructure:/workspace/infrastructure:ro

  worker:
    build:
      target: development
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./apps/worker:/workspace/apps/worker

  web:
    build:
      target: development
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_AUTH_PREVIEW_ENABLED: ${VITE_AUTH_PREVIEW_ENABLED:-true}
      VITE_DEV_API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - ./apps/web:/workspace/apps/web
      - ./packages/ui-components/src:/workspace/packages/ui-components/src
      - ./packages/shared-types/src:/workspace/packages/shared-types/src
      - web-node-modules:/workspace/apps/web/node_modules

  nginx:
    volumes:
      - ./infrastructure/nginx/gateway.development.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  web-node-modules:

networks:
  api-development-access:
  n8n-development-access:
  postgres-development-access:
  redis-development-access:
  storage-development-access:
