name: Publish images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, development]
  workflow_dispatch:
    inputs:
      commit:
        description: Commit SHA to publish
        required: false
        type: string

concurrency:
  group: publish-images-${{ github.event.workflow_run.head_sha || inputs.commit || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          MANUAL_SHA: ${{ inputs.commit }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            sha="$WORKFLOW_SHA"
            channel="$WORKFLOW_BRANCH"
          else
            sha="${MANUAL_SHA:-$GITHUB_SHA}"
            channel="manual"
          fi
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: Dockerfile.api
            target: production
          - component: web
            dockerfile: Dockerfile.web
            target: production
          - component: remote
            dockerfile: Dockerfile.remote
            target: runtime
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          COMPONENT: ${{ matrix.component }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          name="ghcr.io/${repository}-${COMPONENT}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "scan_tag=$name:scan-${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$name:sha-${RELEASE_SHA}"
            echo "$name:${RELEASE_CHANNEL}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build image for security scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ steps.image.outputs.scan_tag }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Scan critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.scan_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
      - name: Publish immutable image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
