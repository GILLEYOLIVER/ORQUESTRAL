name: Publish images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, development]
  workflow_dispatch:
    inputs:
      commit:
        description: Commit SHA to publish
        required: false
        type: string

concurrency:
  group: publish-images-${{ github.event.workflow_run.head_sha || inputs.commit || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          MANUAL_SHA: ${{ inputs.commit }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            sha="$WORKFLOW_SHA"
            channel="$WORKFLOW_BRANCH"
          else
            sha="${MANUAL_SHA:-$GITHUB_SHA}"
            channel="manual"
          fi
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Require successful CI for manual publication
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          conclusion="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&status=success&per_page=1" \
              --jq '.workflow_runs[0].conclusion // empty'
          )"
          if [ "$conclusion" != "success" ]; then
            printf 'O commit %s nao possui uma execucao de CI aprovada.\n' "$RELEASE_SHA" >&2
            exit 1
          fi

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: Dockerfile.api
            target: production
          - component: web
            dockerfile: Dockerfile.web
            target: production
          - component: remote
            dockerfile: Dockerfile.remote
            target: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          COMPONENT: ${{ matrix.component }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          name="ghcr.io/${repository}-${COMPONENT}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "scan_tag=$name:scan-${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$name:sha-${RELEASE_SHA}"
            echo "$name:${RELEASE_CHANNEL}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build image for security scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ steps.image.outputs.scan_tag }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Scan critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.scan_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
      - name: Publish immutable image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true
      - name: Verify registry provenance
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_REFERENCE" \
            --format '{{ json .Provenance.SLSA }}' \
            | jq -e '
                .buildType == "https://mobyproject.org/buildkit@v1"
                and (.materials | length > 0)
              '
