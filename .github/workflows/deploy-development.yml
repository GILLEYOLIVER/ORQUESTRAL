name: Deploy development

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA from the development branch
        required: true
        type: string

concurrency:
  group: deploy-development
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    steps:
      - name: Resolve commit
        id: commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo "RENDER_DEPLOY_HOOK não configurado"; exit 1; }
          curl --fail --silent --show-error --get --output /dev/null \
            --data-urlencode "ref=$RELEASE_SHA" "$RENDER_DEPLOY_HOOK"
      - name: Verify deployed commit
        env:
          REMOTE_DEVELOPMENT_URL: ${{ vars.REMOTE_DEVELOPMENT_URL }}
          EXPECTED_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          test -n "$REMOTE_DEVELOPMENT_URL" || { echo "REMOTE_DEVELOPMENT_URL não configurada"; exit 1; }
          bash scripts/verify-deployment.sh "$REMOTE_DEVELOPMENT_URL" "$EXPECTED_COMMIT"
