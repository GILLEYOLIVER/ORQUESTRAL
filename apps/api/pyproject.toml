[project]
name = "orkestral-api"
version = "0.5.0"
description = "API principal da plataforma Orkestral"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.5",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "cryptography==45.0.7",
  "email-validator==2.3.0",
  "fastapi==0.139.1",
  "httpx==0.28.1",
  "orkestral-plugin-sdk==0.1.0",
  "pydantic-settings==2.14.2",
  "pyjwt==2.10.1",
  "redis==6.4.0",
  "sqlalchemy[asyncio]==2.0.51",
  "structlog==26.1.0",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.21",
]

[tool.uv.sources]
orkestral-plugin-sdk = { workspace = true }

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
