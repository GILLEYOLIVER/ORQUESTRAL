[project]
name = "orkestral-worker"
version = "0.3.0"
description = "Worker assíncrono da plataforma Orkestral"
requires-python = ">=3.13,<3.14"
dependencies = [
  "celery[redis]==5.6.3",
  "orkestral-api",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.21",
]

[tool.uv.sources]
orkestral-api = { workspace = true }

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
